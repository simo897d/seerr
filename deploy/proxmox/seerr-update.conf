# Settings for seerr-update. Installed to /etc/default/seerr-update.
# Everything is detected automatically; uncomment a line only to override it.

# The systemd service that runs Seerr (seerr, jellyseerr or overseerr)
#SERVICE=jellyseerr

# The git checkout the service runs from
#APP_DIR=/opt/jellyseerr

# Where to update from. Defaults to whatever the local branch tracks.
#REMOTE=fork
#BRANCH=feature/ai-recommendations

# github: download the build CI made (fast, Seerr is only down for a restart)
# local:  build on this machine (slow, needs ~4 GB RAM, Seerr is down meanwhile)
#BUILD_SOURCE=github

# With BUILD_SOURCE=local, only build versions that passed Fork CI
#REQUIRE_CI=true

# Database and settings backups taken before each update
#BACKUP_ROOT=/var/backups/seerr
#KEEP_BACKUPS=5

# Memory for the build (in MB). Lower it if the container has less RAM.
#NODE_OPTIONS=--max-old-space-size=3072
